name: Build and publish GitHub Pages bundle

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.js"
      - ".github/workflows/build-pages.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.js"
      - ".github/workflows/build-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build production site
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and sync GitHub Pages files
        run: npm run build:pages

      - name: Verify production bundle
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -d assets
          test -n "$(find assets -maxdepth 1 -type f -name '*.js' -print -quit)"
          test -n "$(find assets -maxdepth 1 -type f -name '*.css' -print -quit)"
          grep -q '/assets/' index.html
          echo "Production bundle verified."

      - name: Publish generated bundle to main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A -- index.html assets favicon.svg .nojekyll images downloads

          if git diff --cached --quiet; then
            echo "Generated production bundle is already current."
            exit 0
          fi

          git commit -m "build: refresh GitHub Pages production bundle [skip ci]"
          git push origin HEAD:main
