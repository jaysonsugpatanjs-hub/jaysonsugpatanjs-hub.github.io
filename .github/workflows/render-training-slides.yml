name: Render training PowerPoint slides

on:
  push:
    branches: [main]
    paths:
      - "training/ppt/**/source.pptx"
      - "training/ppt/**/manifest.json"
      - "training/scripts/render_ppt.py"
      - ".github/workflows/render-training-slides.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the source deck
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install slide renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice
          python -m pip install --disable-pip-version-check "pymupdf>=1.24,<2" "Pillow>=10,<13"
      - name: Render and validate each deck
        shell: bash
        run: |
          set -euo pipefail
          for source in training/ppt/*/source.pptx; do
            python training/scripts/render_ppt.py "${source%/source.pptx}"
          done
      - name: Commit generated web slides
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- training/ppt
          if git diff --cached --quiet; then
            echo "Slides are current."
            exit 0
          fi
          git commit -m "build: refresh training slide images [skip ci]"
          git push origin HEAD:main
      - name: Request GitHub Pages build for generated slides
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
