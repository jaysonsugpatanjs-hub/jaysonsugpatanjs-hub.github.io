name: Deploy Supabase training API

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
      - "training/tests/**"
      - ".github/workflows/deploy-supabase-training.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-training-api-deploy
  cancel-in-progress: false

jobs:
  test:
    name: Test training runtime
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
      - run: npm ci
      - run: npm run test:training
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Edge Functions
        shell: bash
        run: |
          set -o pipefail
          if ! deno check --node-modules-dir=auto supabase/functions/training-api/index.ts supabase/functions/admin-api/index.ts supabase/functions/ims-api/index.ts 2>&1 | tee check.log; then
            sed 's/\x1b\[[0-9;]*m//g' check.log | grep -v '^\s*$' | tail -20 | sed 's/^/::error title=deno check::/'
            exit 1
          fi

  deploy:
    name: Deploy Edge Functions
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: dorydpbqwymkeyyxuicu
    steps:
      - uses: actions/checkout@v4

      - name: Confirm deployment credential
        shell: bash
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::GitHub Actions secret SUPABASE_ACCESS_TOKEN is not configured."
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: 2.119.0

      # All functions ship together so the browser and server never drift.
      - name: Deploy training-api, admin-api and ims-api
        shell: bash
        run: |
          set -o pipefail
          for fn in training-api admin-api ims-api; do
            if ! supabase functions deploy "$fn" --project-ref "$SUPABASE_PROJECT_REF" --use-api 2>&1 | tee deploy.log; then
              grep -v '^\s*$' deploy.log | tail -15 | sed "s/^/::error title=deploy $fn::/"
              exit 1
            fi
            echo "::notice title=deploy::$fn deployed"
          done
