name: Deploy Supabase training API

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-supabase-training.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-training-api-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy training-api Edge Function
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: dorydpbqwymkeyyxuicu

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Confirm deployment credential
        shell: bash
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::GitHub Actions secret SUPABASE_ACCESS_TOKEN is not configured."
            exit 1
          fi

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy training-api
        run: supabase functions deploy training-api --project-ref "$SUPABASE_PROJECT_REF"
