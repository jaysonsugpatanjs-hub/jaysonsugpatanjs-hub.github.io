<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#f6f8fa"/><rect width="1200" height="82" fill="#082f56"/><text x="45" y="53" fill="#fff" font-family="Arial" font-size="34" font-weight="700">STOP WORK RESPONSE</text><g font-family="Arial" font-weight="700" text-anchor="middle"><g><rect x="42" y="190" width="165" height="170" rx="18" fill="#d92d3a"/><text x="125" y="245" fill="white" font-size="24">1 STOP</text><text x="125" y="292" fill="white" font-size="16">Cease work</text></g><g><rect x="232" y="190" width="165" height="170" rx="18" fill="#18864b"/><text x="315" y="245" fill="white" font-size="24">2 MAKE SAFE</text><text x="315" y="292" fill="white" font-size="16">Control danger</text></g><g><rect x="422" y="190" width="165" height="170" rx="18" fill="#176aa6"/><text x="505" y="245" fill="white" font-size="24">3 NOTIFY</text><text x="505" y="292" fill="white" font-size="16">Escalate</text></g><g><rect x="612" y="190" width="165" height="170" rx="18" fill="#f2c318"/><text x="695" y="245" fill="#172435" font-size="24">4 REASSESS</text><text x="695" y="292" fill="#172435" font-size="16">Review controls</text></g><g><rect x="802" y="190" width="165" height="170" rx="18" fill="#ef7d21"/><text x="885" y="235" fill="white" font-size="21">5 UPDATE</text><text x="885" y="265" fill="white" font-size="21">DOCUMENTS</text><text x="885" y="305" fill="white" font-size="15">If required</text></g><g><rect x="992" y="190" width="165" height="170" rx="18" fill="#6339a8"/><text x="1075" y="235" fill="white" font-size="20">6 AUTHORISE</text><text x="1075" y="265" fill="white" font-size="20">RESTART</text><text x="1075" y="305" fill="white" font-size="15">Only when safe</text></g></g><g stroke="#8c99a5" stroke-width="8"><path d="M207 275h25"/><path d="M397 275h25"/><path d="M587 275h25"/><path d="M777 275h25"/><path d="M967 275h25"/></g><rect x="115" y="430" width="970" height="92" rx="16" fill="#fff1f2" stroke="#e6a2a8"/><text x="600" y="468" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#b4232e">DEFECT OR CHANGED CONDITION?</text><text x="600" y="502" text-anchor="middle" font-family="Arial" font-size="19" fill="#172435">Do not restart until the condition is reassessed and restart is authorised.</text><text x="600" y="625" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#b4232e">VERIFY AGAINST CURRENT APPROVED PANALO PIPES / CLIENT REQUIREMENTS</text></svg>