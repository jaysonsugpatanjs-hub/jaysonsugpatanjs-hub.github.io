<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#f5f7fa"/><rect width="1200" height="82" fill="#082f56"/><text x="50" y="52" fill="#fff" font-family="Arial" font-size="34" font-weight="700">PPE &amp; PRE-START INSPECTION</text><g font-family="Arial"><rect x="55" y="120" width="520" height="470" rx="20" fill="#fff" stroke="#cfd8e2"/><text x="90" y="165" fill="#18864b" font-size="25" font-weight="700">PERSONAL PROTECTIVE EQUIPMENT</text><g font-size="21" fill="#172435"><text x="95" y="220">✓ Welding helmet / lens</text><text x="95" y="270">✓ Eye / face protection</text><text x="95" y="320">✓ Hearing protection</text><text x="95" y="370">✓ FR clothing</text><text x="95" y="420">✓ Gloves</text><text x="95" y="470">✓ Safety footwear</text><text x="95" y="520">✓ Respiratory PPE if required</text></g><rect x="620" y="120" width="525" height="470" rx="20" fill="#fff" stroke="#cfd8e2"/><text x="655" y="165" fill="#082f56" font-size="25" font-weight="700">EQUIPMENT PRE-START</text><g font-size="21" fill="#172435"><text x="660" y="220">✓ MIG leads, plugs and torch</text><text x="660" y="270">✓ Gas cylinder, regulator and hoses</text><text x="660" y="320">✓ Grinder guard fitted</text><text x="660" y="370">✓ Correct disc and good condition</text><text x="660" y="420">✓ Switch / controls operate correctly</text><text x="660" y="470">✓ Fume control available</text><text x="660" y="520">✓ Work area and exclusion zone ready</text></g></g><text x="600" y="640" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#b4232e">VERIFY PPE AGAINST CURRENT APPROVED SOURCE BEFORE ISSUE</text></svg>